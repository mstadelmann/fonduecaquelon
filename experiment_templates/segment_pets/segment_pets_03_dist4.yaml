defaults:
  - segment_pets_02_dist2
  - _self_

globals:
  project: Segment OXPET
  author: Marc
  comment: "Same experiment as segment_pets_02_dist2, but scaled up to 4 GPUs (Torch DDP). Inherits the 2-GPU config and overrides world_size, gres, and CPU/memory resources accordingly."

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

slurm_cluster:
  cpus_per_task: 24
  gres: gpu:v100sxm:4
  mem: 120G
  world_size: 4

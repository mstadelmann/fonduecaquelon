defaults:
  - segment_pets_01
  - _self_

globals:
  project: Segment OXPET
  author: Marc

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: false
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_and_pad_bilinear:
    - ResizeMaxDimPad:
        max_dim: 256
        interpol_mode: bilinear
  resize_and_pad_nearest:
    - ResizeMaxDimPad:
        max_dim: 256
        interpol_mode: nearest

data:
  OXPET:
    args:
      num_workers: 4
      prefetch_factor: null
      train_batch_size: 8
      val_batch_size: 8


models:
  ccUNET:
    class_name: chuchichaestli.models.unet.unet.UNet
    args:
      dimensions: 2
      in_channels: 3
      out_channels: 3
      down_block_types:
        - DownBlock
        - DownBlock
        - AttnDownBlock
        - AttnDownBlock
      up_block_types:
        - UpBlock
        - UpBlock
        - AttnUpBlock
        - AttnUpBlock
      block_out_channel_mults:
        - 1
        - 2
        - 2
        - 2
      n_channels: 256
      attn_n_heads: 8
      attn_head_dim: 96
      time_embedding: false
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 1.0e-5
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 2
        gamma: 0.95
        

defaults:
  - wandb_keys
  - _self_

globals:
  project: Segment OXPET
  author: Marc
  comment: "Base experiment for segmenting the Oxford Pets dataset using a simple UNET architecture. The model is oversized so better showcase the potential gains in distributed training. This experiment is used as a base for other experiments, which inherit from it and overwrite specific parts (e.g. the transforms, or the model architecture)."

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: false
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_and_pad_bilinear:
    - ResizeMaxDimPad:
        max_dim: 256
        interpol_mode: bilinear
  resize_and_pad_nearest:
    - ResizeMaxDimPad:
        max_dim: 256
        interpol_mode: nearest

models:
  myUNET:
    path: "~/dev/fonduecaquelon/src/networks/simpleUNET.py"
    class_name: simpleUNET
    args:
      in_channels: 3
      out_channels: 3
      encoder_channels: [512,1024,2048]
      input_shape: [256,256]
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 0.0001
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 2
        gamma: 0.95

data:
  OXPET:
    processor: ~/dev/fonduecaquelon/experiment_templates/segment_pets/oxfordpet_preparator.py
    args:
      base_path: ~/data_ML/oxford_pets/
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      num_workers: 4
      prefetch_factor: 2
      train_batch_size: 16
      val_batch_size: 16
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false

train:
  path: ~/dev/fonduecaquelon/experiment_templates/segment_pets/train_oxpets.py
  args:
    epochs: 20
    use_GPU: true
    use_AMP: true
    accumulate_grad_batches: 1
    early_stop_val_loss: 500
    early_stop_train_loss: 500
    early_stop_nan: 5

losses:
  cross_ent:
    class_name: torch.nn.CrossEntropyLoss
    args:
      reduction: mean

store:
  results_path: ~/data_ML/results
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 4
  use_tensorboard: false
  use_wandb: true
  wandb_project: oxford_pets
  wandb_entity: stmd

test:
  processor: ~/dev/fonduecaquelon/experiment_templates/segment_pets/oxpets_test.py
  test_model: best
  args:
    metrics:
      nb_test_samples: "10"

slurm_cluster:
  fdq_test_repo: true # Pull FDQ from https://test.pypi.org instead of the official PyPI - for debugging purposes only
  fdq_version: 0.1.13dev1
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/ # path where fdq stores temporary results.
  scratch_data_path: /scratch/fdq_data/ # if defined, fdq will first copy your data to this path and load it from there. Most beneficial when data is read multiple times (e.g. many epochs).
  log_path: ~/dev/fonduecaquelon/slurm_log
  job_time: 30
  stop_grace_time: 3 # time in minutes to wait after sending the stop signal before forcefully killing the job. This gives the job time to do some last cleanup operations (e.g. uploading results to wandb, or copying files from scratch back to home)
  cpus_per_task: 8
  cpus_per_task_test: 8
  gres: gpu:a100sxm:1
  gres_test: gpu:a100sxm:1
  mem: 120G
  mem_test: 120G
  partition: gpu_top
  account: cai_ivs
  auto_resubmit: false
  world_size: 1

defaults:
  - segment_pets_01
  - _self_

globals:
  project: Segment OXPET
  author: Marc
  comment: "Same experiment as parent, but distributed over 2 GPUS (Torch DDP). This is only faster if the model is large enough to benefit from parallelism"

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

data:
  OXPET:
    args:
      ddp_num_workers: 4 # num_workers in DDP is set to 0, as depending on the dataloader, it might be problematic. Use ddp_num_workers to overwrite this.

slurm_cluster:
  comment: "Assign the same number of GPUs to your job as your world size. Also, this will require more CPU cores and more memory, as multiple dataloaders will be launched."
  cpus_per_task: 16
  cpus_per_task_test: 8
  gres: gpu:a100sxm:2
  gres_test: gpu:a100sxm:1
  mem: 80G
  mem_test: 60G
  world_size: 2

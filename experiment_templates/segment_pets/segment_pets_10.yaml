defaults:
  - wandb_keys
  - _self_

globals:
  project: Segment OXPET
  author: Marc
  comment: "Base experiment for segmenting the Oxford Pets dataset using the chuchichaestli UNET architecture. This experiment is used as a base for other experiments, which inherit from it and overwrite specific parts (e.g. the transforms, or the model architecture)."

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: false
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null

transforms:
  resize_and_pad_bilinear:
    - ResizeMaxDimPad:
        max_dim: 256
        interpol_mode: bilinear
  resize_and_pad_nearest:
    - ResizeMaxDimPad:
        max_dim: 256
        interpol_mode: nearest

models:
  myUNET:
    class_name: chuchichaestli.models.unet.unet.UNet
    args:
      dimensions: 2
      in_channels: 3
      out_channels: 3
      down_block_types:
        - DownBlock
        - DownBlock
      up_block_types:
        - UpBlock
        - UpBlock
      block_out_channel_mults:
        - 1
        - 2
      time_embedding: false
    optimizer:
      class_name: torch.optim.Adam
      args:
        lr: 0.001
    lr_scheduler:
      class_name: torch.optim.lr_scheduler.StepLR
      args:
        step_size: 2
        gamma: 0.95

data:
  OXPET:
    processor: ~/dev/fonduecaquelon/experiment_templates/segment_pets/oxfordpet_preparator.py
    args:
      base_path: ~/data_ML/oxford_pets/
      subset_train: 1.0
      subset_val: 1.0
      subset_test: 1.0
      pin_memory: true
      num_workers: 4
      prefetch_factor: null
      train_batch_size: 16
      val_batch_size: 16
      test_batch_size: 1
      shuffle_train: true
      shuffle_val: false
      shuffle_test: false

train:
  path: ~/dev/fonduecaquelon/experiment_templates/segment_pets/train_oxpets.py
  args:
    epochs: 8
    use_GPU: true
    use_AMP: true
    accumulate_grad_batches: 1
    early_stop_val_loss: 500
    early_stop_train_loss: 500
    early_stop_nan: 5

losses:
  cross_ent:
    class_name: torch.nn.CrossEntropyLoss
    args:
      reduction: mean

store:
  results_path: ~/data_ML/results
  img_exp_nb: 4
  save_last_model: true
  save_best_val_model: true
  save_best_train_model: true
  checkpoint_frequency: 4
  use_tensorboard: false
  use_wandb: true
  wandb_project: oxford_pets
  wandb_entity: stmd

test:
  processor: ~/dev/fonduecaquelon/experiment_templates/segment_pets/oxpets_test.py
  test_model: best
  args:
    metrics:
      nb_test_samples: "10"

slurm_cluster:
  fdq_test_repo: true
  fdq_version: 0.1.11.dev5
  python_env_module: python/3.12.4
  uv_env_module: uv/0.6.12
  cuda_env_module: cuda/12.8.0
  scratch_results_path: /scratch/fdq_results/
  scratch_data_path: null
  log_path: ~/dev/fonduecaquelon/slurm_log
  job_time: 8
  stop_grace_time: 3
  cpus_per_task: 8
  cpus_per_task_test: 8
  gres: gpu:a100sxm:1
  gres_test: gpu:1
  mem: 120G
  mem_test: 120G
  partition: gpu
  account: cai_ivs
  auto_resubmit: false
  world_size: 1
  additional_pip_packages:
    - chuchichaestli==0.2.17

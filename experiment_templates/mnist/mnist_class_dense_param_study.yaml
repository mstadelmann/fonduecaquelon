defaults:
  - mnist_class_dense
  - _self_

globals:
  project: "MNIST classifier"
  author: "Marc"

models:
  simpleNet:
    optimizer:
      class_name@p: ["torch.optim.Adam":"torch.optim.SGD"]
      args:
        lr@p: [0.001:0.003:2]

mode:
  run_train: true
  run_test_interactive: false
  run_test_auto: true
  dump_model: false
  run_inference: false
  print_model_summary: false
  resume_chpt_path: null
